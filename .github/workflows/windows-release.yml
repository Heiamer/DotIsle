name: Build and package Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: "3.5.1"
      publish:
        description: Publish the release instead of leaving a draft
        type: boolean
        default: false
      verify_only:
        description: Build and verify artifacts without creating a release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve release version
        run: |
          $version='${{ inputs.version }}'
          if(-not $version){$version='${{ github.ref_name }}'.TrimStart('v')}
          if($version -notmatch '^\d+\.\d+\.\d+(-rc[1-9]\d*)?$'){throw "Invalid version $version"}
          "VERSION=$version" >> $env:GITHUB_ENV
          "PRERELEASE=$($version.Contains('-rc').ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Verify release source, version and licenses
        run: python build/verify_release_source.py --version $env:VERSION --report validation/source/report.json

      - name: Test NetEase page reader
        run: |
          node --test tests/netease-timeline.test.cjs
          if($LASTEXITCODE -ne 0){throw 'Page reader tests failed'}

      - name: Prepare GNU toolchain, Zig, LLVM and Inno Setup
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          $zigZip=Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip' -OutFile $zigZip
          if((Get-FileHash $zigZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158'){throw 'Zig checksum mismatch'}
          Expand-Archive $zigZip (Join-Path $env:RUNNER_TEMP 'zig') -Force
          $zig=(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'zig') -Filter zig.exe -Recurse | Select-Object -First 1).FullName
          if(-not $zig){throw 'Zig download is missing zig.exe'}
          "DOTISLE_ZIG=$zig" >> $env:GITHUB_ENV
          choco install llvm -y --no-progress
          $dlltool='C:\Program Files\LLVM\bin\llvm-dlltool.exe'
          if(-not(Test-Path $dlltool)){
            $dlltool=(Get-ChildItem 'C:\Program Files\LLVM' -Filter llvm-dlltool.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if(-not $dlltool){throw 'llvm-dlltool.exe is missing'}
          "DOTISLE_DLLTOOL=$dlltool" >> $env:GITHUB_ENV
          $compiler='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not(Test-Path $compiler)){
            $download=Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
            if((Get-AuthenticodeSignature $download).Status -ne 'Valid'){throw 'Inno signature verification failed'}
            $directory=Join-Path $env:RUNNER_TEMP 'inno'
            $process=Start-Process $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',('/DIR="'+$directory+'"')) -WindowStyle Hidden -Wait -PassThru
            if($process.ExitCode -ne 0){throw 'Inno installation failed'}
            $compiler=Join-Path $directory 'ISCC.exe'
          }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Restore Rust build cache
        id: rust_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-gnu-zig013-rust-${{ hashFiles('Rust/Cargo.lock', 'tools/li-cargo.ps1', 'Rust/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-gnu-zig013-rust-${{ hashFiles('Rust/Cargo.lock', 'tools/li-cargo.ps1', 'Rust/Cargo.toml') }}-

      - name: Build release binaries and internal DLLs
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/li-cargo.ps1 build --release --workspace --bins --lib --locked
          if($LASTEXITCODE -ne 0){throw 'DLL build failed'}

      - name: Test workspace against built service DLLs
        run: |
          $env:DOTISLE_MODULE_DIR="$pwd/target/release"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/li-cargo.ps1 test --workspace --locked
          if($LASTEXITCODE -ne 0){throw 'Module regression failed'}

      - name: Package installer, portable, OTA and source
        run: |
          $out=Join-Path $pwd 'publish/release-output'
          New-Item -ItemType Directory -Force $out | Out-Null
          if ('${{ inputs.verify_only }}' -eq 'true') {
            Copy-Item release-notes/DotIsle-Modular-Verification.md "$out/DotIsle-$env:VERSION-Notes.md"
          } else {
          Copy-Item "release-notes/DotIsle-$env:VERSION-Notes.md" $out
          }
          python build/package_release.py --binary-dir "$pwd/target/release" --output $out --work-dir "$env:RUNNER_TEMP/package" --iscc $env:INNO_SETUP_COMPILER --version $env:VERSION --shader-cache "$pwd/Assets/ShaderCache/Hybrid29"
          if($LASTEXITCODE -ne 0){throw 'Packaging failed'}
          python build/package_modules.py --runtime "$out/DotIsle-$env:VERSION" --output $out --version $env:VERSION
          if($LASTEXITCODE -ne 0){throw 'Module packaging failed'}
          git archive --format=zip --prefix="DotIsle-$env:VERSION-Source/" -o "$out/DotIsle-$env:VERSION-Source.zip" HEAD
          $index=Join-Path $out "LyricIsland-$env:VERSION-Modules.json"
          "$((Get-FileHash $index -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($index))" | Add-Content "$out/LyricIsland-$env:VERSION-SHA256.txt" -Encoding ascii
          $lines=@()
          Get-ChildItem $out -File | Where-Object {$_.Name -ne "DotIsle-$env:VERSION-SHA256.txt"} | Sort-Object Name | ForEach-Object {
            $lines += "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $lines | Set-Content "$out/DotIsle-$env:VERSION-SHA256.txt" -Encoding ascii

      - name: Verify packaged settings app
        env:
          DOTISLE_LAYOUT_AUDIT: "1"
          DOTISLE_LAYOUT_AUDIT_CAPTURE: "0"
        run: python build/verify_packaged_ui.py --runtime "publish/release-output/DotIsle-${{ env.VERSION }}" --output validation

      - name: Verify native timers and optional island effects
        run: |
          $runtime="$pwd/publish/release-output/DotIsle-$env:VERSION"
          python tests/verify_pomodoro.py $runtime --scratch "$env:RUNNER_TEMP/native-timers" --report validation/native-timers/report.json
          if($LASTEXITCODE -ne 0){throw 'Native timer acceptance failed'}
          $env:LYRICISLAND_TEST_PIPE='LyricIsland.Settings.test.release-effects.'+[guid]::NewGuid().ToString('N')
          foreach($effect in @('liquid','glow')){
            $destination="$pwd/validation/$effect"
            $process=Start-Process "$runtime/LyricIsland.exe" -ArgumentList @("--$effect-preview",$destination,'--data-dir',"$env:RUNNER_TEMP/native-effects") -WindowStyle Hidden -PassThru
            if(-not $process.WaitForExit(180000)){
              $process.Kill()
              throw "$effect capture timed out"
            }
            if($process.ExitCode -ne 0){throw "$effect capture failed: $($process.ExitCode)"}
          }

      - name: Build focus-only acceptance DLLs without rebuilding CORE
        run: |
          $before=(Get-FileHash target/release/dotisle_core.dll -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Force validation/module-fixtures | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/li-cargo.ps1 build --release --locked --package dotisle-focus --lib --features module-probe
          if($LASTEXITCODE -ne 0){throw 'Focus probe build failed'}
          Copy-Item target/release/dotisle_focus.dll validation/module-fixtures/focus-probe.dll
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/li-cargo.ps1 build --release --locked --package dotisle-focus --lib --features module-broken
          if($LASTEXITCODE -ne 0){throw 'Rollback fixture build failed'}
          Copy-Item target/release/dotisle_focus.dll validation/module-fixtures/focus-broken.dll
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/li-cargo.ps1 build --release --locked --package dotisle-focus --lib
          if($LASTEXITCODE -ne 0){throw 'Restoring production focus build failed'}
          if((Get-FileHash target/release/dotisle_core.dll -Algorithm SHA256).Hash -ne $before){throw 'CORE changed during focus-only builds'}

      - name: Verify module replacement, independent updates and automatic rollback
        run: |
          python tests/test_module_packages.py
          if($LASTEXITCODE -ne 0){throw 'Resource package regression failed'}
          python tests/verify_modules.py --runtime "publish/release-output/DotIsle-$env:VERSION" --probe validation/module-fixtures/focus-probe.dll --broken validation/module-fixtures/focus-broken.dll --scratch "$env:RUNNER_TEMP/module-transactions" --report validation/modules/report.json
          if($LASTEXITCODE -ne 0){throw 'Module transaction acceptance failed'}

      - name: Package validation evidence
        if: always()
        run: |
          $out="$pwd/publish/release-output"
          if(Test-Path 'validation'){
            New-Item -ItemType Directory -Force $out | Out-Null
            Compress-Archive -Path 'validation/*' -DestinationPath "$out/DotIsle-$env:VERSION-Validation.zip" -Force
            $hash=(Get-FileHash "$out/DotIsle-$env:VERSION-Validation.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content "$out/DotIsle-$env:VERSION-SHA256.txt" "$hash  DotIsle-$env:VERSION-Validation.zip"
          }

      - name: Require successful acceptance reports
        run: |
          foreach($report in @('validation/source/report.json','validation/settings/report.json','validation/settings/layout-audit/report.json','validation/themes/report.json','validation/themes/background-report.json','validation/covers/report.json','validation/native-timers/report.json','validation/liquid/report.json','validation/glow/report.json','validation/modules/report.json')){
            if(-not(Test-Path -LiteralPath $report)){throw "Missing acceptance report: $report"}
            if((Get-Content -LiteralPath $report -Raw | ConvertFrom-Json).success -ne $true){throw "Acceptance failed: $report"}
          }

      - name: Create draft release and upload artifacts
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="v$env:VERSION"
          gh release view $tag --json isDraft,isPrerelease,assets 2>$null
          if($LASTEXITCODE -eq 0){throw "Release $tag already exists; inspect it before replacement"}
          $releaseArgs=@('release','create',$tag,'--target',$env:GITHUB_SHA,'--draft','--title',"点屿 DotIsle $env:VERSION",'--notes-file',"release-notes/DotIsle-$env:VERSION-Notes.md")
          if($env:PRERELEASE -eq 'true'){$releaseArgs+='--prerelease'}
          gh @releaseArgs
          if($LASTEXITCODE -ne 0){throw 'Draft release creation failed'}
          $files=@(Get-ChildItem 'publish/release-output' -File | ForEach-Object FullName)
          gh release upload $tag @files
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}

      - name: Publish release when requested
        if: ${{ !inputs.verify_only && (github.event_name == 'push' || inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="v$env:VERSION"
          if($env:PRERELEASE -eq 'true'){
            gh release edit $tag --draft=false --prerelease=true --latest=false
          }else{
            gh release edit $tag --draft=false --prerelease=false --latest
          }
          if($LASTEXITCODE -ne 0){throw 'Release publish failed'}

      - name: Preserve Rust cache even when acceptance fails
        if: ${{ always() && steps.rust_cache.outcome == 'success' && steps.rust_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-gnu-zig013-rust-${{ hashFiles('Rust/Cargo.lock', 'tools/li-cargo.ps1', 'Rust/Cargo.toml') }}-${{ github.sha }}

      - name: Save packages and verification for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ env.VERSION }}
          retention-days: 7
          path: |
            publish/release-output/**
            validation/**
