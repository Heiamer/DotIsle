[package]
name="dotisle-lyrics"
version="1.0.0"
edition="2021"
license="MIT"
[lib]
name="dotisle_lyrics"
crate-type=["cdylib","rlib"]
[dependencies]

dotisle-module-api={path="../dotisle-module-api"}
lyric-core = { path = "../lyric-core" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
roxmltree = "0.20"
base64.workspace = true
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader"] }

encoding_rs={version="0.8",optional=true}
flate2.workspace=true
[build-dependencies]

cc = "=1.10.0"

[features]
default = ["gbk"]
gbk = ["dep:encoding_rs"]

[dev-dependencies]
