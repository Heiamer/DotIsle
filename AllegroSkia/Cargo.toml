[package]
name = "allegro-skia"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "DotIsle-Allegro"
path = "src/main.rs"

[dependencies]
skia-safe = { version = "0.90", features = ["textlayout"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Power", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices"] }
windows-core = "0.61"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
